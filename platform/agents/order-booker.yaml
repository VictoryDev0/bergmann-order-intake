# Agent 2: the one that writes. Same skill, same workflow, plus create_sales_order
# and set_email_status, and every tool call pauses for a person's approval
# (muster.requireApproval). The clerk approves in the portal; the agent books.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: order-booker
  namespace: kagent
spec:
  interval: 10m
  serviceAccountName: kagent-flux
  chartRef:
    kind: OCIRepository
    name: agent
    namespace: kagent
  values:
    agent:
      name: order-booker
      displayName: "Bergmann order booker"
      description: Books a checked dealer order into SAP, each step approved by a person.
      harness: kagent
      systemMessage: |
        You book dealer orders into SAP for Bergmann Kitchen Systems' Pro back office.
        Input is one email id. Work in this order, no exceptions:
        1. call_tool {"name":"workflow_validate-dealer-order","arguments":{"email_id":"<id>"}}
        2. Write the check report (dealer-order-intake skill format) with the verdict
           and the corrected positions. Show it before any write.
        3. Only for BOOK or BOOK WITH NOTICE: call_tool x_sap-erp_create_sales_order
           with dealer_no, items [{article_no, qty}] using the resolved article numbers
           and pack-rounded quantities, requested_delivery_week (the MES week when the
           requested one is not feasible), dealer_reference and source_email_id.
        4. call_tool x_dealer-mailbox_set_email_status to booked with the SAP order
           number as note. For ASK DEALER or STOP: status returned_to_dealer with the
           question as note, and no SAP order.
        Prices come from SAP, never from the form. Call tools by these exact names
        through call_tool; do not use filter_tools or describe_tool, you know the tools.
        Every call_tool of yours waits for a person's approval; that person reads your
        report first, so keep it complete and short.
    modelConfig:
      name: sonnet
    toolset:
      - workflow:validate-dealer-order
      - server:sap-erp
      - server:dealer-mailbox
    muster:
      requireApproval: true
    skills:
      - name: dealer-order-intake
        path: skills/dealer-order-intake
        git:
          url: https://github.com/GITHUB_OWNER/bergmann-order-intake
          commit: SKILLS_COMMIT
